name: Build Flutter App

on:
  push:
    branches:
      - release  # Replace 'release' with your target branch name

permissions:
  contents: write  # Required if publishing to GitHub Releases

jobs:
  build_android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      # Option A: Save build inside the GitHub Actions run summary
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Option B: Publish/overwrite the latest build on the Releases page
      - name: Update Latest Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest-build
          name: Latest Build (${{ github.ref_name }})
          files: build/app/outputs/flutter-apk/app-release.apk
